<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Error</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none;
  }
  .container { text-align: center; max-width: 480px; padding: 0 24px; }
  .icon { font-size: 48px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #f87171; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.8; }
  .hint { margin-top: 24px; font-size: 13px; color: #475569; }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">&#9888;</div>
    <h1>服务启动失败</h1>
    <p>后端或 Agent 服务未能成功启动。<br>请检查 Python/Node.js 环境是否正确安装。</p>
    <div class="hint">提示：请先运行 setup.bat 配置环境，然后重试。</div>
  </div>
</body>
</html>
