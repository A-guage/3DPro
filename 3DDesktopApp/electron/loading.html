<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D Scene Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none;
  }
  .container { text-align: center; }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid #334155;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #f1f5f9; }
  p { font-size: 14px; color: #64748b; line-height: 1.6; }
  .step { margin-top: 16px; font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>3D Scene Generator</h1>
    <p>正在初始化服务...</p>
    <div class="step" id="step">启动后端服务中</div>
  </div>
  <script>
    const steps = ['启动后端服务中', '启动 AI Agent 服务中', '加载前端界面...'];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % steps.length;
      document.getElementById('step').textContent = steps[i];
    }, 3000);
  </script>
</body>
</html>
