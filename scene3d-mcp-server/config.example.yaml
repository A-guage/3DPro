# Scene3D MCP Server Configuration
# Copy to config.yaml and fill in your values

scene3d:
  # 3D generation backend: hunyuan | tripo | meshy | local
  provider: hunyuan

  # File storage directory
  storage_dir: ./storage

  # SQLite database path
  database_path: ./drizzle/scene3d.db

  # HTTP API port (for frontend via gateway proxy)
  http_port: 3020

# Provider-specific configurations
# Values starting with $ are resolved from environment variables
providers:
  hunyuan:
    secret_id: $TENCENT_SECRET_ID
    secret_key: $TENCENT_SECRET_KEY
    region: ap-guangzhou
    endpoint: ai3d.tencentcloudapi.com
    version: "2025-05-13"
    create_action: SubmitHunyuanTo3DRapidJob
    status_action: QueryHunyuanTo3DRapidJob

  # tripo:
  #   api_key: $TRIPO_API_KEY
  #   base_url: https://api.tripo3d.ai/v2/openapi

  # meshy:
  #   api_key: $MESHY_API_KEY
  #   base_url: https://api.meshy.ai/v2
